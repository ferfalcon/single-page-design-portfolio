name: Stage 7 workflow-state repair

on:
  push:
    branches:
      - workflow/stage-7-plan

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-7-plan
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repair generated workflow projections
        shell: bash
        run: |
          set -euo pipefail
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI sync
          $CLI sync --check
          $CLI validate
          $CLI context --json
          git diff --check

      - name: Commit CLI-produced repair and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage7-repair.yml .workflow/stage7-debug.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .workflow .github/workflows/stage7-repair.yml
          git commit -m "Repair Stage 7 workflow projections"
          git push origin HEAD:workflow/stage-7-plan
