name: Advance Stage 4 workflow

on:
  push:
    branches:
      - workflow/stage-4-approval

permissions:
  contents: write

jobs:
  advance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record Stage 4 approval and advance
        shell: bash
        run: |
          set -euo pipefail
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"

          $CLI snapshot verify SRC-DS-001 \
            --result "Unchanged" \
            --method "Fresh Figma metadata inspection of Workflow page 2141:862" \
            --evidence "The scoped Workflow page still exposes the mobile, tablet, and desktop Home frames, responsive Header/Footer/Hero/About/Work/Contact components, carousel Default/Hover/Focus states, profile portrait, and five Work assets after completion of the Stage 4 specification; no material upstream design change was observed before Stage 4 approval."

          $CLI snapshot verify SRC-REPO-001 \
            --result "Expected workflow output" \
            --method "Git baseline and workflow-output inspection" \
            --evidence "The immutable implementation baseline remains unchanged. Comparing SRC-REPO-001 to main through the approved Stage 4 specification shows only workflow state and documentation artifacts; frontend implementation files remain unchanged."

          $CLI stage review \
            --result "Passed" \
            --evidence "Project owner approved the Stage 4 Specification on 2026-08-18. The specification completes both required review passes, makes the approved requirements and design intent testable with SPEC and AC traceability, and has no blocking specification decision. Stage 5 Document Review content is intentionally not started by this approval action." \
            --approved-by "Fernando Falcon"

          $CLI stage advance
          $CLI sync --check
          $CLI validate
          $CLI status --json
          git diff --check

      - name: Commit CLI-produced state and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/advance-stage-4.yml .workflow/stage4-approval-kick.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .workflow IMPLEMENTATION-BRIEF.md .github/workflows/advance-stage-4.yml
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Record Stage 4 approval and advance workflow"
          git push origin HEAD:workflow/stage-4-approval
