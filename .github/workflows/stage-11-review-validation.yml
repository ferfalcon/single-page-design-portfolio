name: Stage 11 correction planning

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  plan-correction:
    if: github.head_ref == 'agent/stage-10-implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-10-implementation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rewind and register accessibility correction
        shell: bash
        run: |
          set -euo pipefail
          CLI='node docs/implementation-workflow/cli/design-workflow.mjs'
          $CLI sync
          $CLI context --json

          $CLI stage rewind 9 \
            --reason 'Stage 11 independent axe-core validation found a serious WCAG 1.3.1 list-structure defect: Work uses li elements with role=group directly under a ul, overriding their native listitem role at 375px, 768px, and 1440px. A corrected implementation output and retest are required before final acceptance.'

          $CLI trace define IMPL-001 \
            --owner ART-IMPLEMENTATION-REVIEW \
            --required true \
            --references PLAN-003,PLAN-004

          $CLI task create \
            --title 'Correct Work carousel list semantics' \
            --baseline SRC-REPO-002 \
            --references IMPL-001,PLAN-003,PLAN-004 \
            --path Phase-01--Task-02.md

          $CLI task validation set P01-T02 \
            --name Build \
            --kind Build \
            --required true \
            --status 'Not executed' \
            --expected 'The corrected Astro production build succeeds with pnpm build.' \
            --reason 'Pending correction implementation.' \
            --references PLAN-004

          $CLI task validation set P01-T02 \
            --name 'Accessibility semantics' \
            --kind Accessibility \
            --required true \
            --status 'Not executed' \
            --expected 'Axe-core reports no critical or serious violations at 375px, 768px, and 1440px; the carousel retains list semantics, position context, accessible controls, focus retention, and polite announcements.' \
            --reason 'Pending correction implementation and retest.' \
            --references IMPL-001,PLAN-003,PLAN-004

          $CLI task validation set P01-T02 \
            --name 'Carousel regression' \
            --kind Test \
            --required true \
            --status 'Not executed' \
            --expected 'Initial Work 03, cyclic one-step navigation, Enter/Space and touch activation, rapid-input serialization, reduced motion, and no-JavaScript fallback remain unchanged.' \
            --reason 'Pending correction implementation and regression testing.' \
            --references PLAN-003,PLAN-004

          $CLI task validation set P01-T02 \
            --name 'Responsive and visual regression' \
            --kind Responsive \
            --required true \
            --status 'Not executed' \
            --expected 'The semantic correction introduces no layout or visual regression at the 375px, 768px, and 1440px Figma exemplars or 320px reflow.' \
            --reason 'Pending correction implementation and rendered comparison.' \
            --references PLAN-004

          $CLI task validation set P01-T02 \
            --name 'Vercel preview' \
            --kind Manual \
            --required true \
            --status 'Not executed' \
            --expected 'A Vercel preview for the corrected implementation is READY and renders the corrected carousel markup before final review.' \
            --reason 'Pending corrected implementation preview.' \
            --references PLAN-004

          $CLI task ready P01-T02
          $CLI sync
          $CLI sync --check
          $CLI validate
          $CLI context --json

      - name: Persist correction plan and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/stage-11-review-validation.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add .workflow Phase-01--Task-02.md
          git add -u .github/workflows/stage-11-review-validation.yml 2>/dev/null || true
          git commit -m 'Plan Stage 11 accessibility correction'
          git push origin HEAD:agent/stage-10-implementation
