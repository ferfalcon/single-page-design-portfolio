name: Stage 5 document review runner

on:
  push:
    branches:
      - workflow/stage-5-document-review

permissions:
  contents: write

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow/stage-5-document-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Stage 5 documentation corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          # PROJECT-CONTEXT.md — remove stale Stage 0 approval blockers.
          replace('PROJECT-CONTEXT.md',
              '| Use Lite profile | Workflow | `SRC-DS-001`, `SRC-REPO-001` | Proposed for Stage 0 approval |',
              '| Use Lite profile | Workflow | `SRC-DS-001`, `SRC-REPO-001` | Confirmed through `GATE-001` |')
          replace('PROJECT-CONTEXT.md',
              '### Blocking\n\n- Canonical verification records for `SRC-DS-001` and `SRC-REPO-001` are still required before Stage 0 can close.\n- Stage 0 artifacts and gate require explicit approval before advancement.',
              '### Blocking\n\n- None. Stage 0 was approved and closed through `GATE-001`; the canonical workflow is now in Stage 5.')
          replace('PROJECT-CONTEXT.md',
              '- [ ] Canonical source verifications are recorded.\n- [ ] Stage 0 approval/gate is recorded.',
              '- [x] Canonical source verifications are recorded.\n- [x] Stage 0 approval/gate is recorded.\n\n**Stage 0 status:** Approved through `GATE-001`. Later mutable workflow state is owned by `.workflow/workflow-record.json`.')

          # SOURCE-BASELINE.md — align historical verification status with canonical records.
          replace('SOURCE-BASELINE.md',
              '| 2026-08-18T01:55:05Z | `SRC-DS-001` | Direct Figma metadata inspection | Pending canonical verification | Unknown | Record a CLI verification before Stage 0 closure |\n| 2026-08-18T01:55:05Z | `SRC-REPO-001` | GitHub branch/commit inspection | Pending canonical verification | No observed change | Record a CLI verification before Stage 0 closure |',
              '| 2026-08-18T02:20:31Z | `SRC-DS-001` | Direct Figma metadata inspection | Unchanged (`VER-001`) | No | Canonically verified for Stage 0 |\n| 2026-08-18T02:20:32Z | `SRC-REPO-001` | GitHub branch/immutable-commit inspection | Expected workflow output (`VER-002`) | No frontend change | Canonically verified for Stage 0 |\n| 2026-08-18T05:16:57Z | `SRC-DS-001` | Fresh Figma metadata inspection | Unchanged (`VER-007`) | No material upstream change | Used for Stage 4 approval |\n| 2026-08-18T05:16:57Z | `SRC-REPO-001` | Git baseline/workflow-output inspection | Expected workflow output (`VER-008`) | No frontend change | Used for Stage 4 approval |\n\nStage 5 performed an additional read-only source challenge. The source identity and scoped structures remain stable, but that review uncovered a previously missed **existing source inconsistency**: the layer named `Work Image / 05` in every `Section/Work` viewport variant instances `Asset/Work/02`, while the distinct standalone `Asset/Work/05` exists but is unused by those variants. This is documented as `AUD-009`; it is not evidence of upstream source drift and does not create a new `SRC-*` snapshot by itself.')
          replace('SOURCE-BASELINE.md',
              '- [ ] Canonical `snapshot verify` records still need to be written before Stage 0 closure.',
              '- [x] Canonical `snapshot verify` records were written before Stage 0 closure (`VER-001`, `VER-002`).')
          replace('SOURCE-BASELINE.md',
              '- [ ] Re-run generated-state and stage preflight checks after canonical verification.',
              '- [x] Generated-state and Stage 0 preflight checks were rerun before `GATE-001` was recorded.\n\n**Stage 0 status:** Approved through `GATE-001`. The canonical record owns the complete verification history.')

          # WORKFLOW-STATE.md — make the narrative projection stop contradicting canonical state.
          replace('WORKFLOW-STATE.md',
              '| BQ-001 | Approve the initialized Lite Stage 0 baseline and allow canonical source verification/gate closure? | Project owner | Controls entry to Stage 1 | Stage 0 advance | Open |',
              '| BQ-001 | Approve the initialized Lite Stage 0 baseline and allow canonical source verification/gate closure? | Project owner | Controlled entry to Stage 1 | Stage 0 advance | Resolved — approved through `GATE-001` |')
          replace('WORKFLOW-STATE.md',
              '| The current implementation target remains a static Astro page with no backend/integration scope | Inferred from repository + Figma evidence | Supports Lite profile | Recheck during design audit | Open |\n| Existing production runtime is not required as an active Stage 0 input | Recommended | Keeps initial baseline limited to authoritative design/repository inputs | Register runtime snapshot before preview/final validation if needed | Open |',
              '| The current implementation target remains a static Astro page with no backend/integration scope | Inferred from repository + Figma evidence | Supports Lite profile | Rechecked through Stage 4 | Confirmed for current scope |\n| Existing production runtime is not required as an active Stage 0 input | Recommended | Keeps initial baseline limited to authoritative design/repository inputs | Register runtime snapshot before preview/final validation if needed | Deferred |')
          replace('WORKFLOW-STATE.md',
              '| 2026-08-18 | Initialization | — | `SRC-DS-001` | Time-bound Figma source registered | Stage 0 | Canonically verify before gate | Open |\n| 2026-08-18 | Initialization | — | `SRC-REPO-001` | Immutable repository commit registered | Stage 0 | Canonically verify before gate | Open |',
              '| 2026-08-18 | Initialization | — | `SRC-DS-001` | Time-bound Figma source registered | Stage 0 | Canonically verify before gate | Closed by `VER-001` / `GATE-001` |\n| 2026-08-18 | Initialization | — | `SRC-REPO-001` | Immutable repository commit registered | Stage 0 | Canonically verify before gate | Closed by `VER-002` / `GATE-001` |\n| 2026-08-18 | Stage verification | `SRC-DS-001` | `SRC-DS-001` | Reverified unchanged through `VER-007` | Stages 2–4 | Preserve time-bound identity; continue rechecks | Active |\n| 2026-08-18 | Stage verification | `SRC-REPO-001` | `SRC-REPO-001` | Reverified as expected workflow-only output through `VER-008` | Stages 2–4 | Preserve immutable implementation baseline | Active |\n| 2026-08-18 | Stage 5 review | `SRC-DS-001` | `SRC-DS-001` | No upstream drift; previously missed Work-slot source inconsistency found (`AUD-009`) | Stage 5 | Resolve asset mapping before Stage 5 approval | Open blocker |')
          replace('WORKFLOW-STATE.md',
              '## 9. Latest Completion Summary\n\n- Files created or modified: Stage 0 narrative artifacts plus CLI-managed workflow record/generated views.\n- Input snapshot IDs used: `SRC-DS-001`, `SRC-REPO-001`\n- Task-start snapshot: None\n- Implementation-output snapshot: None\n- Validation-runtime snapshot: None\n- Source verification performed: Direct Figma and GitHub inspection completed; canonical verification record pending approval/closure.\n- Important findings: The Figma scope is a responsive single portfolio page; the repository frontend is still the Astro starter.\n- Decisions: Initialize as Lite + Gated.\n- Validation performed: Source identity and repository commit inspected; generated state was reproduced from the repository\'s schema-v2 initializer/rendering rules.\n- Deviations: Repository reference uses the canonical GitHub URL rather than a local filesystem path because initialization is being committed through the connected GitHub interface.\n- Remaining risks: Mutable Figma source; source verification/gate not yet recorded.\n- Next permitted action: Review and approve Stage 0, then record canonical input verification and the Stage 0 gate before advancing to Stage 1.',
              '## 9. Latest Completion Summary\n\n- Canonical workflow state: Stage 5 — Review documentation consistency, In progress.\n- Gates passed: `GATE-001` through `GATE-005` (Stages 0–4).\n- Active inputs: `SRC-DS-001`, `SRC-REPO-001`.\n- Current task / implementation output / validation runtime: None.\n- Source verification: Canonical checks exist through `VER-008`; the Stage 5 read-only challenge found no upstream drift and no frontend changes since `SRC-REPO-001`.\n- Stage 5 finding: `AUD-009` — every scoped `Work Image / 05` instance currently resolves to `Asset/Work/02`, while standalone `Asset/Work/05` exists unused.\n- Remaining blocker: Project-owner direction is required on whether implementation preserves the duplicate source assembly or uses the standalone Work 05 asset for logical slot 05.\n- Next permitted action: Complete Stage 5 document review after resolving `AUD-009`; then run/confirm Stage 5 preflight and request explicit Stage 5 gate approval. Architecture, planning, task decomposition, and frontend implementation remain unstarted.')

          # DESIGN-AUDIT.md — align approval state and record the missed source inconsistency.
          replace('DESIGN-AUDIT.md', 'status: Draft', 'status: Approved')
          replace('DESIGN-AUDIT.md', '- Status: Draft\n- Version: 0.2', '- Status: Approved\n- Version: 0.3')
          replace('DESIGN-AUDIT.md',
              '| `AUD-008` | Accessibility / State | Focus variants exist, but the design source cannot establish keyboard triggering, focus order, or focus management | `SRC-DS-001` → interactive component sets | Implementation accessibility behavior remains to be specified and validated | Observed |',
              '| `AUD-008` | Accessibility / State | Focus variants exist, but the design source cannot establish keyboard triggering, focus order, or focus management | `SRC-DS-001` → interactive component sets | Implementation accessibility behavior remains to be specified and validated | Observed |\n| `AUD-009` | Content / Source assembly | In Mobile, Tablet, and Desktop `Section/Work`, the layer named `Work Image / 05` resolves to `Asset/Work/02` (`6:377`) and uses the Work 02 image, while the distinct standalone `Asset/Work/05` (`6:380`) exists on the same scoped page but is not used by those variants | `SRC-DS-001` → `2171:3170`, `2171:3182`, `2171:3194`; standalone `6:380` | The Stage 4 assumption that logical Work position 05 displays `Asset/Work/05` is not source-proven. Implementation needs an explicit owner decision: preserve the duplicated Work 02 source assembly or treat the unused Work 05 asset as the intended slot-05 content | Observed; unresolved Stage 5 blocker |')
          replace('DESIGN-AUDIT.md',
              '### Product questions\n\n- No blocking product question remains from `AUD-001` or `AUD-002`. Exact carousel boundary/wrap behavior is a downstream specification detail under the confirmed “standard carousel” direction.\n- Whether Work images are also clickable project links is not demonstrated and has not been requested; do not add project-link behavior unless later evidence or owner direction introduces it.',
              '### Product questions\n\n- No blocking product question remains from `AUD-001` or `AUD-002`; their downstream behavior is specified.\n- **Stage 5 blocker — `AUD-009`:** Should logical Work position 05 preserve the scoped component assembly exactly (a second instance of Work 02), or should it use the distinct standalone `Asset/Work/05` that exists in the scoped source but is currently unused by `Section/Work`? This choice changes visible portfolio content and must not be guessed.\n- Whether Work images are also clickable project links is not demonstrated and has not been requested; do not add project-link behavior unless later evidence or owner direction introduces it.')
          replace('DESIGN-AUDIT.md',
              '- Verification date and method: 2026-08-18; direct Figma page metadata inspection, read-only Figma Plugin API inspection of components/variants/variables/styles/assets/reactions, and rendered screenshots of all three Home frames.\n- Active snapshot status: Verified for this audit inspection; the source remains time-bound and mutable.\n- Newer source content detected: No material change from the Stage 0 scoped structure was observed.\n- Action required: Reverify `SRC-DS-001` before material downstream work according to the workflow’s time-bound snapshot rules.',
              '- Verification date and method: 2026-08-18; direct Figma page metadata inspection, read-only Figma Plugin API inspection of components/variants/variables/styles/assets/reactions, and rendered screenshots of all three Home frames. Stage 5 additionally re-queried the live `Section/Work` variant trees and image-instance mappings.\n- Active snapshot status: Canonically reverified through `VER-007`; the source remains time-bound and mutable.\n- Newer source content detected: No material upstream change from the registered scope was observed. Stage 5 did uncover the previously missed existing `AUD-009` assembly inconsistency; this is a review correction, not source drift.\n- Action required: Resolve `AUD-009` before Stage 5 approval, and continue to reverify `SRC-DS-001` before later material work according to the time-bound snapshot rules.')
          replace('DESIGN-AUDIT.md',
              '## 22. Completion Summary\n\n- Files created or modified: `DESIGN-AUDIT.md`.\n- Snapshot IDs used: `SRC-DS-001`.\n- Source verification performed: Yes — Figma metadata, Plugin API inspection, and screenshots.\n- Important findings: Figma does not demonstrate CTA activation or Work carousel activation mechanics; the owner has resolved current implementation direction as `href="#"` for consultation links and a standard previous/next carousel for Work. Accent CTA and three service-label combinations have confirmed contrast gaps that must be addressed in implementation. Intermediate responsive behavior, reduced-motion handling, keyboard behavior, and final image alt copy are not proven by Figma.\n- Assumptions introduced: No material assumption remains for `AUD-001` or `AUD-002`; those items now have explicit owner direction. Exact carousel edge/wrap behavior remains a downstream specification detail rather than a Stage 1 assumption.\n- Open questions or blockers: `AUD-001` and `AUD-002` are owner-resolved for downstream work. `AUD-003` and `AUD-004` are confirmed implementation notes rather than Stage 1 blockers. Remaining non-blocking gaps include exact contrast treatment, reduced-motion behavior, carousel edge semantics, and final alternative text. Formal Stage 1 closure is still blocked only by the unexecuted stage preflight and explicit Stage 1 approval.\n- Stage preflight: Not executed in this runtime because no local repository checkout/`design-workflow` CLI is available. This prevents formal Stage 1 gate closure here.\n- Ready for requirements: No — pending Stage 1 preflight and explicit project-owner approval of the Stage 1 audit.',
              '## 22. Completion Summary\n\n- Artifact status: Approved through `GATE-002`; canonical Stage 1 closure and preflight were completed after the original audit draft.\n- Snapshot IDs used: `SRC-DS-001`, with repository context carried by canonical `SRC-REPO-001`.\n- Important Stage 1 findings: `AUD-001` and `AUD-002` received owner direction; `AUD-003` and `AUD-004` became implementation accessibility obligations; `AUD-005`–`AUD-008` defined downstream responsive/accessibility evidence gaps.\n- Stage 5 correction: `AUD-009` records a previously missed existing source assembly inconsistency in Work position 05. This does not invalidate the approved carousel direction, but it does invalidate the assumption that slot 05 source content is unambiguously `Asset/Work/05`.\n- Current blocker: Resolve whether logical Work position 05 preserves the source duplicate of Work 02 or uses standalone `Asset/Work/05`.\n- Source verification: Canonical Figma verification exists through `VER-007`; Stage 5’s additional read-only Figma check found no upstream drift.\n- Frontend/Figma mutation during Stage 5 review: None.')

          # IMPLEMENTATION-BRIEF.md — make Stage 5 current and correct the slot-05 assumption at its owning layers.
          replace('IMPLEMENTATION-BRIEF.md',
              '- Current workflow checkpoint: Stage 4 — Specification\n- Requirements are approved through `GATE-003` and design intent through `GATE-004`. Specification is the active checkpoint; repository-aware planning, architecture decision, and final Lite review are intentionally not started.',
              '- Current workflow checkpoint: Stage 5 — Review documentation consistency\n- Requirements are approved through `GATE-003`, design intent through `GATE-004`, and specification through `GATE-005`. Stage 5 document review is active; repository-aware planning, architecture handling, task decomposition, and implementation are intentionally not started.\n\n### Stage 5 source challenge\n\n- A fresh read-only Figma metadata/Plugin API check on 2026-08-18 confirmed the same scoped `🤖 Workflow` page, Home exemplars, responsive components, control states, and standalone Work assets; no material upstream design drift was observed.\n- A GitHub comparison from immutable `SRC-REPO-001` to current `main` shows workflow/documentation changes only and no `frontend/` changes.\n- The deeper Work-instance check uncovered `AUD-009`: every viewport variant’s layer named `Work Image / 05` currently instances `Asset/Work/02`, while standalone `Asset/Work/05` exists unused. This was present in the active source but missed by earlier review; it is not treated as source drift.\n- Stage 5 therefore reopens only the logical slot-05 content mapping. The rest of the approved Stage 4 carousel behavior remains supported unless the owner’s `AUD-009` decision requires a narrower correction.')
          replace('IMPLEMENTATION-BRIEF.md',
              'Description: The Work section must provide conventional previous and next controls that allow users to navigate through the five source-provided Work items.',
              'Description: The Work section must provide conventional previous and next controls that allow users to navigate through five logical Work positions.')
          replace('IMPLEMENTATION-BRIEF.md',
              'Rationale: The design supplies five Work assets and previous/next controls; `AUD-002` was explicitly resolved by the project owner as a standard carousel.',
              'Rationale: The design supplies five logical Work slots, standalone Work assets 01–05, and previous/next controls; `AUD-002` was explicitly resolved as a standard carousel. Stage 5 later found that the scoped slot named 05 currently instances Work 02 rather than the standalone Work 05 asset (`AUD-009`).')
          replace('IMPLEMENTATION-BRIEF.md',
              '  - All five source-provided Work items are reachable through the carousel interaction.\n  - The precise start position, wrap/boundary behavior, and transition behavior are defined later in Stage 4 rather than invented here.',
              '  - All five logical Work positions are reachable through the carousel interaction.\n  - The visible asset used for logical position 05 must follow the explicit resolution of `AUD-009`; the requirement does not silently choose between the source duplicate and standalone Work 05 asset.\n  - The precise start position, wrap/boundary behavior, and transition behavior are defined later in Stage 4 rather than invented here.')
          replace('IMPLEMENTATION-BRIEF.md',
              '- `SRC-DS-001` remains time-bound. A fresh read-only Figma inspection on 2026-08-18 confirmed the scoped `🤖 Workflow` page (`2141:862`), the three Home exemplars, `Section/Work` (`2171:3199`), the five ordered Work assets (`6:376` through `6:380`), and the Default/Hover/Focus variants of both carousel controls.',
              '- `SRC-DS-001` remains time-bound. A fresh read-only Figma inspection on 2026-08-18 confirmed the scoped `🤖 Workflow` page (`2141:862`), the three Home exemplars, `Section/Work` (`2171:3199`), the five standalone Work assets (`6:376` through `6:380`), and the Default/Hover/Focus variants of both carousel controls. Stage 5 later established that the `Section/Work` slot named 05 instances `6:377` rather than `6:380`; see `AUD-009`.')
          replace('IMPLEMENTATION-BRIEF.md',
              '  - The initial HTML contains all five Work images; client JavaScript is not required to render the portfolio content.\n  - If carousel JavaScript does not initialize, the five Work items remain reachable through a static horizontally scrollable gallery or equivalent non-scripted fallback.',
              '  - The initial HTML contains all five logical Work positions; client JavaScript is not required to render the portfolio content.\n  - If carousel JavaScript does not initialize, the five logical positions remain reachable through a static horizontally scrollable gallery or equivalent non-scripted fallback.\n  - The asset assigned to logical position 05 is governed by the eventual `AUD-009` resolution; progressive enhancement must not hide that decision.')
          replace('IMPLEMENTATION-BRIEF.md',
              '  - Work 05 alternative text: **“Hand holding a smartphone displaying a designer portfolio beside a drink and small plant.”**\n  - Alternative text is not duplicated as a visible caption unless a later product requirement adds captions.',
              '  - Standalone `Asset/Work/05` (`6:380`) alternative text: **“Hand holding a smartphone displaying a designer portfolio beside a drink and small plant.”**\n  - **`AUD-009` guard:** do not assign the standalone Work 05 description to logical slot 05 unless the owner resolves that slot to `6:380`. If the exact scoped assembly is preserved, logical slot 05 repeats Work 02 and must use the Work 02 alternative text instead.\n  - Alternative text is not duplicated as a visible caption unless a later product requirement adds captions.')
          replace('IMPLEMENTATION-BRIEF.md',
              '| 5 | `Asset/Work/05` (`6:380`) | Meaningful Work image |\n\n- No item has a project-detail destination in current scope.\n- The ordered dataset is cyclic for Previous/Next navigation only; content order remains 01–05.',
              '| 5 | Scoped `Work Image / 05` currently → `Asset/Work/02` (`6:377`); standalone `Asset/Work/05` (`6:380`) exists unused | Meaningful Work position; asset mapping blocked by `AUD-009` |\n\n- No position has a project-detail destination in current scope.\n- The ordered logical dataset is cyclic for Previous/Next navigation only; position order remains 01–05.\n- `AUD-009` must be resolved before implementation so position 05 has one intentional, traceable asset/alternative-text mapping.')
          replace('IMPLEMENTATION-BRIEF.md',
              '| `AC-010` | Decorative service graphics are hidden from assistive technology and the profile plus all five Work images use the final alternative text in `SPEC-ACC-004`. |',
              '| `AC-010` | Decorative service graphics are hidden from assistive technology; the profile and each rendered Work position use alternative text matching the actual resolved asset, including the `AUD-009` slot-05 decision. |')
          replace('IMPLEMENTATION-BRIEF.md',
              '- Stage 5 document review, architecture handling, planning, task decomposition, and implementation are not started here.',
              '- At Stage 4 authoring time, document review and later checkpoints were not started. Stage 5 is now active; architecture handling, planning, task decomposition, and implementation remain unstarted.')
          replace('IMPLEMENTATION-BRIEF.md',
              '- [x] Exact alternative-text wording is defined from direct inspection of the meaningful profile and Work assets.',
              '- [x] Alternative-text wording was defined from direct asset inspection; Stage 5 later constrained slot 05 so the standalone Work 05 text cannot be applied unless `AUD-009` resolves that asset into the carousel.')
          replace('IMPLEMENTATION-BRIEF.md',
              '- Finalized image alternatives from rendered asset inspection rather than generic filenames.',
              '- Finalized image alternatives from rendered asset inspection rather than generic filenames; Stage 5 later identified that the scoped slot-05 instance does not currently use the standalone Work 05 asset.')
          replace('IMPLEMENTATION-BRIEF.md',
              '### Stage 4 readiness\n\n**Ready for gated Stage 4 approval.** The Stage 4 specification is complete. Formal Stage 4 gate closure requires explicit project-owner approval and is not recorded here; Stage 5 — Document Review has not been started.',
              '### Stage 4 readiness\n\n**Approved through `GATE-005`.** The Stage 4 specification passed its gate and the workflow advanced to Stage 5. The Stage 5 challenge subsequently found `AUD-009`, which reopens only the slot-05 asset mapping until the project owner decides how to resolve the source inconsistency.')
          replace('IMPLEMENTATION-BRIEF.md',
              '### Blocking\n\n- None for the Stage 4 specification checkpoint.',
              '### Blocking\n\n- **`AUD-009` (Stage 5):** logical Work slot 05 is named as position 05 but currently instances `Asset/Work/02`; standalone `Asset/Work/05` exists unused. The implementation must not guess which visual is intended.')
          replace('IMPLEMENTATION-BRIEF.md',
              '- `GATE-004` records the approved Stage 3 design intent. Stage 4 is ready for explicit project-owner review/approval; no Stage 4 gate pass or Stage 5 advancement is claimed here.',
              '- `GATE-005` records the approved Stage 4 specification. Stage 5 is active and is intentionally blocked on `AUD-009` until the project owner resolves the visible slot-05 content mapping.')
          replace('IMPLEMENTATION-BRIEF.md',
              '## 11. Review Pass 1 — Completeness and Correctness\n\nOverall Lite review not started. Stage-specific review passes are recorded in the Requirements and Design Intent sections.\n\n## 12. Corrections from Pass 1\n\nOverall Lite review corrections not started.\n\n## 13. Review Pass 2 — Consistency, Traceability, Source Integrity, Risks, and Uncertainty\n\nOverall Lite review not started. Stage-specific consistency reviews are recorded in the Requirements and Design Intent sections.\n\n## 14. Readiness\n\nNot evaluated for task decomposition. The current gated checkpoint is **Stage 4 specification ready for approval**; Stage 5 document review has not started.',
              '## 11. Review Pass 1 — Completeness and Correctness\n\nStage 5 challenged the approved Stage 1–4 material after its stage-specific corrections.\n\n- [x] Requirements, design intent, specification, acceptance criteria, and source/audit evidence were cross-read for coverage and ownership.\n- [x] Canonical `.workflow/workflow-record.json` was compared with the narrative Stage 0–4 documents. Several stale narrative statements incorrectly still described Stage 0 or Stage 4 as awaiting approval.\n- [x] Fresh Figma metadata plus a read-only Plugin API tree inspection confirmed the scoped responsive structures, Work geometry, item-03 centering, control-state inventory, and absence of a Disabled carousel state.\n- [x] Fresh repository comparison confirmed no frontend implementation drift from `SRC-REPO-001`; changes since the baseline are workflow/documentation only.\n- [x] A material source/data inconsistency was found: `Work Image / 05` in all three `Section/Work` variants uses `Asset/Work/02`, while standalone `Asset/Work/05` exists unused (`AUD-009`).\n- [x] No additional unsupported route, backend, autoplay, project-link behavior, arbitrary breakpoint, or custom keyboard convention was found in the approved scope.\n\n## 12. Corrections from Pass 1\n\n- Corrected stale Stage 0 approval/verification statements in `PROJECT-CONTEXT.md`, `SOURCE-BASELINE.md`, and `WORKFLOW-STATE.md` so they no longer contradict canonical gates/verifications.\n- Corrected `DESIGN-AUDIT.md` to its canonical Approved state, removed its obsolete Stage 1 closure blocker, and added `AUD-009` with exact source references.\n- Updated this brief to make Stage 5 the active checkpoint and Stage 4 approved through `GATE-005`.\n- Replaced unsupported claims that logical position 05 unambiguously maps to standalone `Asset/Work/05` with the observed current source mapping and an explicit `AUD-009` decision boundary.\n- Kept the standalone Work 05 alternative text as asset-specific evidence while preventing it from being assigned to slot 05 unless that asset is explicitly selected.\n- Preserved the already supported carousel start position, cyclic one-step behavior, no-autoplay rule, accessibility behavior, contrast correction, responsive intent, and progressive-enhancement requirements.\n\n## 13. Review Pass 2 — Consistency, Traceability, Source Integrity, Risks, and Uncertainty\n\n- [x] Narrative stage status now agrees with canonical `GATE-001` through `GATE-005` and the Stage 5 In-progress state.\n- [x] The Stage 5 source check distinguishes **no upstream drift** from a **previously missed existing source inconsistency**; `SRC-DS-001` is not silently redefined.\n- [x] `AUD-009` is owned by the design-audit/source-evidence layer and propagated only where it affects requirements/specification/data/acceptance; it is not presented as a Figma-proven intended correction.\n- [x] The slot-05 ambiguity is visible as a blocker rather than being buried as acceptable debt or silently resolved by assumption.\n- [x] Architecture, repository planning, task IDs, implementation technique, and runtime evidence remain deferred to their owning later checkpoints.\n- [x] No frontend code or Figma node was modified during document review.\n\n## 14. Readiness\n\n**Blocked — Stage 5 is not ready for gate approval yet.** The project owner must resolve `AUD-009` by choosing one intentional slot-05 mapping:\n\n1. **Preserve exact scoped assembly:** logical position 05 repeats `Asset/Work/02`, matching the current `Section/Work` components and Home compositions.\n2. **Use standalone Work 05:** logical position 05 uses `Asset/Work/05` (`6:380`), treating the named slot plus otherwise-unused asset as evidence of an assembly mistake in the source.\n\nNo Stage 6 architecture work, planning, task decomposition, or frontend implementation should begin until that choice is recorded, affected Stage 5 text is normalized, Stage 5 preflight passes, and the project owner explicitly approves the Stage 5 gate.')
          PY

      - name: Run canonical Stage 5 checks
        shell: bash
        run: |
          node docs/implementation-workflow/cli/design-workflow.mjs context --json
          node docs/implementation-workflow/cli/design-workflow.mjs stage check --json
          node docs/implementation-workflow/cli/design-workflow.mjs sync --check
          node docs/implementation-workflow/cli/design-workflow.mjs validate
          git diff --check

      - name: Commit reviewed documentation and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage5-document-review.yml
          git add PROJECT-CONTEXT.md SOURCE-BASELINE.md WORKFLOW-STATE.md DESIGN-AUDIT.md IMPLEMENTATION-BRIEF.md
          git commit -m "Review Stage 5 documentation consistency"
          git push origin HEAD:workflow/stage-5-document-review
