name: Stage 5 PR document review runner

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  review:
    if: github.event.pull_request.head.ref == 'workflow/stage-5-document-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workflow/stage-5-document-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract and run Stage 5 review patch
        shell: bash
        run: |
          python - <<'EXTRACT'
          from pathlib import Path
          text = Path('.github/workflows/stage5-document-review.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/stage5_review.py').write_text('\n'.join(lines) + '\n')
          EXTRACT
          python /tmp/stage5_review.py
      - name: Run canonical Stage 5 checks
        shell: bash
        run: |
          node docs/implementation-workflow/cli/design-workflow.mjs context --json
          node docs/implementation-workflow/cli/design-workflow.mjs stage check --json
          node docs/implementation-workflow/cli/design-workflow.mjs sync --check
          node docs/implementation-workflow/cli/design-workflow.mjs validate
          git diff --check
      - name: Commit documentation-only review
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage5-document-review.yml .github/workflows/stage5-pr-runner.yml .workflow/stage5-review-trigger.txt
          git add PROJECT-CONTEXT.md SOURCE-BASELINE.md WORKFLOW-STATE.md DESIGN-AUDIT.md IMPLEMENTATION-BRIEF.md
          git commit -m "Review Stage 5 documentation consistency"
          git push origin HEAD:workflow/stage-5-document-review
