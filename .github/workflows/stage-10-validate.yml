name: Stage 10 validate

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

jobs:
  validate:
    if: github.head_ref == 'agent/stage-10-implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-10-implementation

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build production site
        run: pnpm --dir frontend build

      - name: Verify implementation contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = (path) => fs.readFileSync(path, 'utf8');
          const index = read('frontend/src/pages/index.astro');
          const consultation = read('frontend/src/components/ConsultationLink.astro');
          const hero = read('frontend/src/components/Hero.astro');
          const about = read('frontend/src/components/About.astro');
          const work = read('frontend/src/components/Work.astro');
          const contact = read('frontend/src/components/Contact.astro');
          const script = read('frontend/src/scripts/work-carousel.ts');
          const globalCss = read('frontend/src/styles/global.css');
          const pageCss = read('frontend/src/styles/page.css');
          const carouselCss = read('frontend/src/styles/work-carousel.css');

          const requireText = (haystack, needle, label) => {
            if (!haystack.includes(needle)) throw new Error(`Missing ${label}: ${needle}`);
          };

          requireText(consultation, 'href="#"', 'approved CTA placeholder');
          requireText(hero, 'Design solutions made easy', 'hero heading');
          requireText(about, 'Portrait of Amy smiling against a colorful geometric background.', 'profile alt text');
          requireText(work, "work-05.png", 'standalone Work 05 asset');
          requireText(work, 'aria-label="Previous project"', 'previous accessible name');
          requireText(work, 'aria-label="Next project"', 'next accessible name');
          requireText(work, 'aria-roledescription="carousel"', 'carousel semantics');
          requireText(work, 'aria-live="polite"', 'carousel live region');
          requireText(script, 'activeIndex = Math.min(2, slides.length - 1)', 'initial project 03');
          requireText(script, 'inputQueue', 'serialized carousel input');
          requireText(script, "window.matchMedia('(prefers-reduced-motion: reduce)')", 'reduced-motion behavior');
          requireText(carouselCss, 'transition: transform 200ms ease-out', 'approved carousel timing');
          requireText(carouselCss, 'overflow-x: auto', 'no-JS scroll fallback');
          requireText(globalCss, ':focus-visible', 'visible focus styling');
          requireText(pageCss, '.consultation-link--accent', 'accent CTA styling');
          requireText(pageCss, 'color: var(--ink);', 'dark text accessibility override');
          requireText(contact, 'Book a call with me', 'contact heading');
          requireText(index, '<main id="main-content">', 'main landmark');

          const workImports = [...work.matchAll(/work-0[1-5]\.png/g)].map((match) => match[0]);
          if (new Set(workImports).size !== 5) throw new Error('Expected five distinct Work asset imports.');
          if ((work.match(/data-carousel-slide/g) || []).length !== 1) throw new Error('Work slides must be generated from the five-item project array.');

          console.log('Static implementation contract checks passed.');
          NODE

      - name: Verify generated page contains one route
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          test "$(find frontend/dist -name index.html -type f | wc -l)" -eq 1
          grep -q 'Design solutions made easy' frontend/dist/index.html
          grep -q 'work-05' frontend/dist/index.html

      - name: Install browser test tooling
        run: |
          pnpm --dir frontend add --save-dev @playwright/test@latest --lockfile=false
          pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Start production preview
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir frontend preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/astro-preview.log
          exit 1

      - name: Create browser validation suite
        shell: bash
        run: |
          mkdir -p frontend/tests
          cat > frontend/tests/portfolio.spec.ts <<'TEST'
          import { test, expect } from '@playwright/test';

          const url = 'http://127.0.0.1:4321/';

          for (const width of [320, 375, 768, 1024, 1440]) {
            test(`responsive layout ${width}px`, async ({ page }) => {
              await page.setViewportSize({ width, height: 900 });
              await page.goto(url);
              await expect(page.getByRole('heading', { level: 1, name: 'Design solutions made easy' })).toBeVisible();
              await expect(page.locator('.service-card')).toHaveCount(6);
              await expect(page.locator('[data-carousel-slide]')).toHaveCount(5);
              await expect(page.getByRole('heading', { level: 2 })).toHaveCount(3);
              const scrollWidth = await page.evaluate(() => document.documentElement.scrollWidth);
              expect(scrollWidth).toBeLessThanOrEqual(width);

              if (width === 375) await expect(page.locator('.hero')).toHaveCSS('width', '343px');
              if (width === 768) await expect(page.locator('.hero')).toHaveCSS('width', '704px');
              if (width === 1440) await expect(page.locator('.hero')).toHaveCSS('width', '1110px');

              const current = page.locator('[data-carousel-slide][aria-current="true"]');
              await expect(current).toHaveAttribute('data-index', '2');

              if ([375, 768, 1440].includes(width)) {
                await page.screenshot({ path: `test-results/visual/portfolio-${width}.png`, fullPage: true });
              }
            });
          }

          test('carousel is cyclic, serialized, focus-safe, and announced', async ({ page }) => {
            await page.setViewportSize({ width: 375, height: 900 });
            await page.goto(url);
            const next = page.getByRole('button', { name: 'Next project' });
            const previous = page.getByRole('button', { name: 'Previous project' });
            await expect(next).toBeEnabled();
            await expect(previous).toBeEnabled();

            await next.focus();
            await next.click();
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '3');
            await expect(page.locator('[data-carousel-status]')).toHaveText('Project 4 of 5');
            await expect(next).toBeFocused();

            await page.evaluate(() => {
              const button = document.querySelector<HTMLButtonElement>('[data-carousel-next]');
              button?.click(); button?.click(); button?.click();
            });
            await page.waitForTimeout(700);
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '1');
            await expect(page.locator('[data-carousel-status]')).toHaveText('Project 2 of 5');

            await page.evaluate(() => {
              const button = document.querySelector<HTMLButtonElement>('[data-carousel-previous]');
              button?.click(); button?.click();
            });
            await page.waitForTimeout(450);
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '4');
            await expect(page.locator('[data-carousel-status]')).toHaveText('Project 5 of 5');

            const stableIndex = await page.locator('[data-carousel-slide][aria-current="true"]').getAttribute('data-index');
            await page.waitForTimeout(450);
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', stableIndex ?? '');
          });

          test('reduced motion updates without animated delay', async ({ page }) => {
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.setViewportSize({ width: 768, height: 900 });
            await page.goto(url);
            await page.getByRole('button', { name: 'Next project' }).click();
            await page.waitForTimeout(30);
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '3');
            await expect(page.locator('[data-carousel-status]')).toHaveText('Project 4 of 5');
          });

          test('no-JavaScript fallback keeps all work items reachable with no dead controls', async ({ browser }) => {
            const context = await browser.newContext({ javaScriptEnabled: false, viewport: { width: 375, height: 900 } });
            const page = await context.newPage();
            await page.goto(url);
            await expect(page.locator('[data-carousel-slide]')).toHaveCount(5);
            await expect(page.locator('[data-carousel-controls]')).toBeHidden();
            const geometry = await page.locator('[data-carousel-track]').evaluate((element) => ({
              scrollWidth: element.scrollWidth,
              clientWidth: element.clientWidth,
            }));
            expect(geometry.scrollWidth).toBeGreaterThan(geometry.clientWidth);
            await page.locator('[data-carousel-track]').evaluate((element) => { element.scrollLeft = element.scrollWidth; });
            expect(await page.locator('[data-carousel-track]').evaluate((element) => element.scrollLeft)).toBeGreaterThan(0);
            await context.close();
          });

          test('keyboard focus and approved accessibility color overrides are present', async ({ page }) => {
            await page.setViewportSize({ width: 375, height: 900 });
            await page.goto(url);
            await page.keyboard.press('Tab');
            await expect(page.getByRole('link', { name: 'Skip to main content' })).toBeFocused();
            await page.keyboard.press('Tab');
            await expect(page.getByRole('link', { name: 'Home' }).first()).toBeFocused();

            const accent = page.locator('.consultation-link--accent').first();
            await expect(accent).toHaveCSS('color', 'rgb(3, 3, 3)');
            for (const selector of ['.service-card--ui', '.service-card--apps', '.service-card--photography']) {
              await expect(page.locator(selector)).toHaveCSS('color', 'rgb(3, 3, 3)');
            }
            await expect(page.locator('a[href="#"]')).toHaveCount(4);
          });
          TEST

      - name: Run browser validation suite
        run: pnpm --dir frontend exec playwright test tests/portfolio.spec.ts --reporter=line

      - name: Upload visual validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-10-visual-validation
          path: frontend/test-results/visual
          if-no-files-found: warn
