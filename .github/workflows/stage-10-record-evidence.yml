name: Stage 10 evidence record

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  record-evidence:
    if: github.head_ref == 'agent/stage-10-implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-10-implementation
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Confirm validated frontend is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet bcbef7eacb207478164f37040a6d31b0371b928e HEAD -- frontend/

      - name: Install and build current branch
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Install temporary browser tooling
        run: |
          pnpm --dir frontend add --save-dev @playwright/test@latest --lockfile=false
          pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Start production preview
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir frontend preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/astro-preview.log
          exit 1

      - name: Run final zoom keyboard and touch checks
        shell: bash
        run: |
          mkdir -p frontend/tests
          cat > frontend/tests/stage-10-gaps.spec.ts <<'TEST'
          import { test, expect } from '@playwright/test';

          const url = 'http://127.0.0.1:4321/';

          test('200 percent zoom-equivalent layout reflows without page overflow', async ({ page }) => {
            // A 1280px desktop viewport at 200% browser zoom exposes ~640 CSS px.
            await page.setViewportSize({ width: 640, height: 900 });
            await page.goto(url);
            await expect(page.getByRole('heading', { level: 1, name: 'Design solutions made easy' })).toBeVisible();
            await expect(page.getByRole('button', { name: 'Previous project' })).toBeVisible();
            await expect(page.getByRole('button', { name: 'Next project' })).toBeVisible();
            const geometry = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
            }));
            expect(geometry.scrollWidth).toBeLessThanOrEqual(geometry.clientWidth);
          });

          test('carousel activates with Enter and Space while retaining focus', async ({ page }) => {
            await page.setViewportSize({ width: 375, height: 900 });
            await page.goto(url);
            const next = page.getByRole('button', { name: 'Next project' });
            await next.focus();
            await page.keyboard.press('Enter');
            await page.waitForTimeout(230);
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '3');
            await expect(next).toBeFocused();
            await page.keyboard.press('Space');
            await page.waitForTimeout(230);
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '4');
            await expect(next).toBeFocused();
            await expect(page.locator('[data-carousel-status]')).toHaveText('Project 5 of 5');
          });

          test('carousel supports touch activation', async ({ browser }) => {
            const context = await browser.newContext({
              viewport: { width: 375, height: 900 },
              hasTouch: true,
              isMobile: true,
            });
            const page = await context.newPage();
            await page.goto(url);
            await page.getByRole('button', { name: 'Next project' }).tap();
            await page.waitForTimeout(230);
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '3');
            await expect(page.locator('[data-carousel-status]')).toHaveText('Project 4 of 5');
            await context.close();
          });
          TEST
          pnpm --dir frontend exec playwright test tests/stage-10-gaps.spec.ts --reporter=line

      - name: Record completed validation evidence
        shell: bash
        run: |
          set -euo pipefail
          EXECUTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CLI='node docs/implementation-workflow/cli/design-workflow.mjs'

          $CLI sync

          $CLI task validation set P01-T01 \
            --name 'Build' \
            --kind Build \
            --required true \
            --status Passed \
            --expected 'The Astro production build succeeds with pnpm build.' \
            --actual 'Clean dependency installation and Astro production build succeeded on the current implementation frontend.' \
            --command 'pnpm build' \
            --environment 'frontend/' \
            --executed-at "$EXECUTED_AT" \
            --evidence "GitHub Actions run ${GITHUB_RUN_ID} rebuilt the current branch successfully; prior full validation run 32124137537 also passed install, production build, static contract, and single-route output checks." \
            --references 'PLAN-001,PLAN-002,PLAN-003,PLAN-004'

          $CLI task validation set P01-T01 \
            --name 'Accessibility' \
            --kind Accessibility \
            --required true \
            --status Passed \
            --expected 'Semantic structure, keyboard and focus behavior, image alternatives, contrast, reflow/zoom, and reduced-motion checks pass.' \
            --actual 'Semantic landmarks and headings, native keyboard focus, image alternatives, approved contrast overrides, 320px reflow, 200%-zoom-equivalent reflow, reduced motion, and no-JavaScript behavior passed browser validation.' \
            --executed-at "$EXECUTED_AT" \
            --evidence "GitHub Actions run 32124137537 passed the full browser/accessibility matrix; run ${GITHUB_RUN_ID} additionally passed 640-CSS-px 200%-zoom-equivalent reflow plus explicit Enter/Space keyboard activation." \
            --references 'PLAN-002,PLAN-003,PLAN-004'

          $CLI task validation set P01-T01 \
            --name 'Responsive and visual fidelity' \
            --kind Responsive \
            --required true \
            --status Passed \
            --expected 'The page remains usable and source-faithful at 375px, 768px, 1440px, 320 CSS px reflow, 200% zoom, and relevant intermediate widths.' \
            --actual 'Rendered validation passed at 320, 375, 640, 768, 1024, and 1440 CSS px; the three supplied Figma exemplars match their exact frame dimensions after the desktop Hero correction.' \
            --executed-at "$EXECUTED_AT" \
            --evidence "GitHub Actions run 32124137537 captured 375x3318, 768x2966, and 1440x2642 screenshots matching Figma frame dimensions and passed no-overflow checks at 320/375/768/1024/1440; run ${GITHUB_RUN_ID} passed the 640px 200%-zoom-equivalent reflow check." \
            --references 'PLAN-002,PLAN-003,PLAN-004'

          $CLI task validation set P01-T01 \
            --name 'Work carousel behavior' \
            --kind Manual \
            --required true \
            --status Passed \
            --expected 'The five-item Work carousel satisfies the approved start state, cyclic one-step controls, keyboard/focus behavior, reduced motion, rapid input handling, and no-JavaScript fallback.' \
            --actual 'The five-item carousel passed initial item 03, both cyclic edges, one-step serialized navigation, focus retention, live status, reduced motion, no-JavaScript reachability, keyboard activation, pointer activation, and touch activation.' \
            --executed-at "$EXECUTED_AT" \
            --evidence "GitHub Actions run 32124137537 passed cyclic, rapid-input, focus, live-region, reduced-motion, pointer, and no-JavaScript checks; run ${GITHUB_RUN_ID} additionally passed explicit Enter, Space, and touch activation checks." \
            --references 'PLAN-003,PLAN-004'

          $CLI task validation set P01-T01 \
            --name 'Vercel preview' \
            --kind Manual \
            --required true \
            --status 'Not executed' \
            --expected 'The implementation branch Vercel preview renders the approved page without material regression before merge.' \
            --reason 'The repaired implementation cannot currently obtain a Vercel preview because Vercel is rejecting branch builds with the account build-rate limit. The earlier pre-repair preview failed on the now-fixed Sharp issue and is not valid completion evidence.' \
            --evidence 'GitHub commit status for the repaired implementation reports Vercel failure with target upgradeToPro=build-rate-limit; Vercel project latest available implementation preview is the earlier Sharp-failing deployment dpl_Hu3FjrnZZPWcFh2CXjYc5hsHxd7z.' \
            --references 'PLAN-004'

          $CLI task block P01-T01 --reason 'Waiting for Vercel to accept a preview deployment of the repaired implementation; current branch builds are blocked by the Vercel build-rate limit.'
          $CLI sync
          $CLI sync --check
          $CLI validate
          $CLI context --json

      - name: Persist canonical workflow state and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/stage-10-record-evidence.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add .workflow
          git add -u .github/workflows/stage-10-record-evidence.yml 2>/dev/null || true
          git commit -m 'Record Stage 10 validation evidence'
          git push origin HEAD:agent/stage-10-implementation
