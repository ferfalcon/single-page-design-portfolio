name: Modern web guidance

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

jobs:
  guidance:
    if: github.head_ref == 'agent/stage-10-implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/stage-10-implementation

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Retrieve mandatory guidance
        run: npx -y modern-web-guidance@latest retrieve "accessibility,performance,carousel-snap-highlights,carousel-slide-effects"
