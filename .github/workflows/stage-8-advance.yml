name: Stage 8 advance

on:
  push:
    branches:
      - workflow/stage-8-plan-review
    paths:
      - .github/workflows/stage-8-advance.yml

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-8-plan-review
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Advance canonical workflow to Stage 8
        run: |
          node docs/implementation-workflow/cli/design-workflow.mjs context --json
          node docs/implementation-workflow/cli/design-workflow.mjs stage advance
          node docs/implementation-workflow/cli/design-workflow.mjs sync
          node docs/implementation-workflow/cli/design-workflow.mjs sync --check
          node docs/implementation-workflow/cli/design-workflow.mjs validate
          node docs/implementation-workflow/cli/design-workflow.mjs context --json
          git diff --check

      - name: Persist canonical state and remove runner
        run: |
          rm .github/workflows/stage-8-advance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .workflow .github/workflows/stage-8-advance.yml
          git commit -m "Advance workflow to Stage 8"
          git push origin HEAD:workflow/stage-8-plan-review
