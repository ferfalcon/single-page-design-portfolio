name: Stage 9 correction approval

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  approve-and-start:
    if: github.head_ref == 'agent/stage-10-implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-10-implementation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Load mandatory modern web guidance
        shell: bash
        run: |
          set -euo pipefail
          npx -y modern-web-guidance@latest search "preserve native list semantics while exposing accessible carousel slide group position semantics" --skill-version 2026_05_16-c5e78707 | tee /tmp/mwg-search.json
          node - <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('/tmp/mwg-search.json','utf8');
          const start = raw.indexOf('[');
          if (start < 0) process.exit(0);
          try {
            const data = JSON.parse(raw.slice(start));
            const ids = data.slice(0,3).map(x => x.id).filter(Boolean).join(',');
            if (ids) fs.writeFileSync('/tmp/mwg-ids.txt', ids);
          } catch {}
          NODE
          if [ -s /tmp/mwg-ids.txt ]; then
            npx -y modern-web-guidance@latest retrieve "$(cat /tmp/mwg-ids.txt)"
          fi

      - name: Record Stage 9 approval and enter correction task
        shell: bash
        run: |
          set -euo pipefail
          CLI='node docs/implementation-workflow/cli/design-workflow.mjs'
          $CLI sync
          $CLI context --json

          $CLI artifact approve ART-TASK-P01-T02 \
            --evidence 'Fernando Falcon explicitly approved corrective Stage 9 in ChatGPT on 2026-08-18 after review of P01-T02.' \
            --approved-by 'Fernando Falcon'
          $CLI sync

          $CLI stage review \
            --result Passed \
            --evidence 'Fernando Falcon explicitly approved Stage 9 and the reviewed corrective task P01-T02 on 2026-08-18.' \
            --approved-by 'Fernando Falcon'
          $CLI sync
          $CLI stage advance
          $CLI sync

          git diff --quiet edd76540e89eb4e82c82ab567c183eb1b9abf0f4 HEAD -- frontend/
          $CLI snapshot verify SRC-REPO-002 \
            --result 'Expected workflow output' \
            --method 'Git diff against immutable implementation-output commit before correction task start' \
            --evidence 'frontend/ is byte-identical to SRC-REPO-002 at edd76540e89eb4e82c82ab567c183eb1b9abf0f4 before P01-T02 begins; intervening branch changes are workflow/review metadata only.'
          $CLI snapshot verify SRC-DS-001 \
            --result Unchanged \
            --method 'Carry-forward of the fresh Stage 11 read-only Figma verification VER-011 immediately preceding the correction rewind' \
            --evidence 'VER-011 on 2026-08-18 freshly inspected Workflow page 2141:862 and found no material design drift; no Figma edits occurred during the review/rewind sequence, and P01-T02 is a semantics-only correction with no intended visual change.'
          $CLI sync
          $CLI task start P01-T02
          $CLI sync
          $CLI sync --check
          $CLI validate
          $CLI context --json

      - name: Persist canonical state and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .workflow Phase-01--Task-02.md
          git commit -m 'Approve Stage 9 correction task'
          git push origin HEAD:agent/stage-10-implementation
          rm .github/workflows/stage-9-approve-start-correction.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -u .github/workflows/stage-9-approve-start-correction.yml 2>/dev/null || true
          git commit -m 'Remove Stage 9 approval runner'
          git push origin HEAD:agent/stage-10-implementation
