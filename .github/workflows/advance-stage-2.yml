name: Advance Stage 2 workflow

on:
  push:
    branches:
      - workflow/stage-2-requirements

permissions:
  contents: write

jobs:
  advance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Advance canonical workflow state
        shell: bash
        run: |
          set -euo pipefail
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"

          # Preserve the owner-approved Stage 2 narrative while allowing the CLI
          # to register/scaffold the Lite consolidated artifact during Stage 1 -> 2.
          cp IMPLEMENTATION-BRIEF.md "$RUNNER_TEMP/IMPLEMENTATION-BRIEF.md"
          rm IMPLEMENTATION-BRIEF.md

          $CLI stage advance

          # Restore the approved Stage 2 requirements content byte-for-byte.
          cp "$RUNNER_TEMP/IMPLEMENTATION-BRIEF.md" IMPLEMENTATION-BRIEF.md

          $CLI snapshot verify SRC-DS-001 \
            --result "Unchanged" \
            --method "Fresh Figma metadata inspection of Workflow page 2141:862" \
            --evidence "The scoped Workflow page, mobile/tablet/desktop Home frames, responsive section and navigation components, carousel controls, and five Work assets remained present before Stage 2 approval."

          $CLI snapshot verify SRC-REPO-001 \
            --result "Expected workflow output" \
            --method "Git baseline and workflow-output inspection" \
            --evidence "The immutable implementation baseline remains unchanged; subsequent main-branch changes through the approved Stage 2 merge contain workflow documentation only and no frontend implementation changes."

          $CLI stage review \
            --result "Passed" \
            --evidence "Project owner approved the Stage 2 requirements on 2026-08-18; the requirements checkpoint has no blocking product decision and the approved audit resolutions are carried forward." \
            --approved-by "Fernando Falcon"

          $CLI stage advance
          $CLI sync --check
          $CLI validate
          $CLI status --json

      - name: Commit CLI-produced state and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/advance-stage-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .workflow IMPLEMENTATION-BRIEF.md .github/workflows/advance-stage-2.yml
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Record Stage 2 approval and advance workflow"
          git push origin HEAD:workflow/stage-2-requirements
