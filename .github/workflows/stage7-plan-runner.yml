      - name: Review artifact and run Stage 7 preflight
        run: |
          node docs/implementation-workflow/cli/design-workflow.mjs artifact review ART-IMPLEMENTATION-BRIEF --evidence "Stage 7 repository context and PLAN-001 through PLAN-004 completed with two review passes."
          node docs/implementation-workflow/cli/design-workflow.mjs sync --check
          node docs/implementation-workflow/cli/design-workflow.mjs validate
          node docs/implementation-workflow/cli/design-workflow.mjs stage check --json | tee /tmp/stage7-check.json
          node docs/implementation-workflow/cli/design-workflow.mjs context --json | tee /tmp/stage7-context.json
          git diff --check
          cat /tmp/stage7-check.json
          cat /tmp/stage7-context.json

      - name: Remove temporary runner and commit Stage 7
        run: |
          rm -f .github/workflows/stage7-plan-runner.yml .github/stage7-plan-trigger.txt
          git add -A
          git commit -m "Plan Stage 7 implementation"
          git push origin HEAD:workflow/stage-7-plan
