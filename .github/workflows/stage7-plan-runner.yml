name: Stage 7 plan runner

on:
  push:
    branches:
      - workflow/stage-7-plan
    paths:
      - .github/stage7-plan-trigger.txt

permissions:
  contents: write

jobs:
  stage7:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-7-plan
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Advance canonical workflow to Stage 7
        run: |
          node docs/implementation-workflow/cli/design-workflow.mjs context --json
          node docs/implementation-workflow/cli/design-workflow.mjs stage advance
          node docs/implementation-workflow/cli/design-workflow.mjs artifact reopen ART-IMPLEMENTATION-BRIEF --evidence "Stage 7 adds repository context and the repository-aware implementation plan to the Lite implementation brief."

      - name: Write Stage 7 repository context and plan
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('IMPLEMENTATION-BRIEF.md')
          text = path.read_text()

          text = text.replace(
              '- Current workflow checkpoint: **Stage 6 — Define or explicitly skip architecture**',
              '- Current workflow checkpoint: **Stage 7 — Create the repository-aware implementation plan**'
          )
          text = re.sub(
              r'- Requirements are approved through `GATE-003`.*?pending the Stage 6 gate\.',
              '- Requirements are approved through `GATE-003`, design intent through `GATE-004`, specification through `GATE-005`, documentation review through `GATE-006`, and architecture through `GATE-007`. Stage 7 is active. The architecture decision remains **Not required** and the project remains Lite; this checkpoint now owns repository inspection, implementation structure, ordering, dependencies, risks, and validation planning. Stage 8 adversarial plan review and later task decomposition remain intentionally unstarted.',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace(
              'Stage 5 is now approved through `GATE-006`; Stage 6 architecture handling is active, while planning, task decomposition, and implementation remain unstarted.',
              'Stage 5 is approved through `GATE-006` and Stage 6 architecture through `GATE-007`; Stage 7 repository-aware planning is now active, while task decomposition and implementation remain unstarted.'
          )

          def replace_between(source, start_heading, end_heading, replacement):
              start = source.index(start_heading)
              end = source.index(end_heading, start)
              return source[:start] + replacement.rstrip() + '\n\n' + source[end:]

          repository_context = r'''## 5. Repository Context

### Observed implementation baseline

- The immutable implementation input remains `SRC-REPO-001` at commit `07635a8eafb4323909619a0b62e41a4d8144d764`. Current `main` has advanced only through approved workflow/documentation checkpoints; no `frontend/` implementation change has replaced that baseline.
- The application boundary is `frontend/`, with Astro `^7.2.2`, TypeScript/module mode, Node `>=22.12.0`, pnpm, and only the repository-confirmed `dev`, `build`, `preview`, and `astro` scripts. No React/Vue/Svelte integration, carousel library, test runner, linter, accessibility test package, backend dependency, or state-management dependency is present.
- `frontend/src/pages/index.astro` is still the Astro starter page and renders only `Welcome.astro` inside `Layout.astro`.
- `frontend/src/components/` contains only the starter `Welcome.astro`; `frontend/src/layouts/` contains only `Layout.astro`.
- `frontend/src/assets/` contains only starter Astro artwork (`astro.svg`, `background.svg`). Portfolio/service/profile/Work assets have not yet been added. `frontend/public/` contains only the starter favicons.
- `frontend/AGENTS.md` requires background-mode Astro development and otherwise defers to Astro documentation. Root `AGENTS.md` requires semantic/accessibility behavior, reduced-motion handling, actual-source inspection, and branch → PR → Vercel preview → verification before merge.
- The confirmed automated frontend validation command is `pnpm build` from `frontend/`. No repository test or lint command exists today, so Stage 7 does not invent one.

### Repository-aware implementation structure

The following paths are proposed by Stage 7; only paths explicitly marked existing are currently present.

| Path | Action | Existing? | Responsibility |
|---|---|---:|---|
| `frontend/src/pages/index.astro` | Modify | Yes | Replace the starter page with the single-page composition in source order and import the page styles/section components. |
| `frontend/src/layouts/Layout.astro` | Modify | Yes | Own document metadata, base landmark shell, global stylesheet loading, and page-level semantics that belong outside individual sections. |
| `frontend/src/components/Welcome.astro` | Delete | Yes | Remove the unused Astro starter UI after the portfolio page replaces it. |
| `frontend/src/assets/astro.svg` | Delete | Yes | Remove unused starter artwork after replacement. |
| `frontend/src/assets/background.svg` | Delete | Yes | Remove unused starter artwork after replacement. |
| `frontend/src/components/Header.astro` | Create | No | Header/logo plus dark consultation action using native link semantics. |
| `frontend/src/components/Hero.astro` | Create | No | Hero heading/copy and six-service responsive card composition, including decorative service artwork and approved contrast corrections. |
| `frontend/src/components/About.astro` | Create | No | Portrait-led About section, meaningful portrait alternative text, copy, and accent consultation action. |
| `frontend/src/components/Work.astro` | Create | No | Static five-item Work markup, visible heading, control shell, slide semantics, fallback gallery, and enhancement hooks. |
| `frontend/src/components/Contact.astro` | Create | No | Dark closing call-to-action section with responsive copy/action layout. |
| `frontend/src/components/Footer.astro` | Create | No | Footer logo and dark consultation action without inventing navigation. |
| `frontend/src/components/ConsultationLink.astro` | Create | No | Small shared Astro primitive for the repeated native `href="#"` consultation action and its Dark/Accent visual roles. |
| `frontend/src/scripts/work-carousel.ts` | Create | No | Dependency-free progressive enhancement for the bounded carousel: logical index, cyclic one-step movement, serialized activation, live-position feedback, and reduced-motion-safe state changes. |
| `frontend/src/styles/global.css` | Create | No | Reset/base rules, design-source token mappings, typography roles, page surface, focus-visible baseline, and shared layout primitives. |
| `frontend/src/styles/page.css` | Create | No | Header/Hero/About/Contact/Footer/service-card layout and source-driven responsive transformations. |
| `frontend/src/styles/work-carousel.css` | Create | No | Fallback horizontal gallery, enhanced track geometry, control states, visual edge cues, transition/reduced-motion rules. |
| `frontend/src/assets/portfolio/` | Create | No | Exported logo/service/profile/Work source assets. Exact filenames/formats remain tied to the inspected Figma exports rather than invented in planning; logical Work slot 05 must use standalone `Asset/Work/05` (`6:380`). |

### Implementation constraints from the repository

- Keep static content in Astro-rendered HTML. Add client JavaScript only for the Work carousel enhancement; do not introduce a framework island or third-party carousel dependency for this bounded interaction.
- Keep CSS external to component markup. Use the proposed stylesheet files instead of inline style attributes or a late styling pass.
- Treat the Figma 375px, 768px, and 1440px widths as visual validation anchors. Media-query values are selected only where the implemented layout actually needs to transform; they are not copied automatically from those exemplar widths.
- Do not add routes, APIs, persistence, authentication, project-detail links, autoplay, or consultation behavior beyond the approved `href="#"` placeholder.
- Asset export and Plus Jakarta Sans delivery must preserve source fidelity without silently introducing an unreviewed runtime service or dependency. If the repository still lacks a permitted font source at implementation time, resolve that as an explicit asset/dependency choice before styling is considered complete.
- Existing Vercel/Astro delivery remains the deployment model; Stage 7 proposes no Vercel configuration or production-promotion change.'''

          implementation_plan = r'''## 6. Implementation Plan

### PLAN-001 — Replace the Astro starter with the portfolio foundation

- Objective: Establish the real page shell, external CSS foundation, source asset location, and semantic structure before section-specific implementation.
- References: `REQ-FR-001`, `REQ-FR-006`, `REQ-AR-001`, `REQ-AR-005`, `REQ-AR-006`, `REQ-NFR-001`, `REQ-NFR-002`; `SPEC-BEH-001`, `SPEC-BEH-003`, `SPEC-ACC-001`, `SPEC-ACC-005`, `SPEC-ACC-006`, `SPEC-VAL-001`, `SPEC-VAL-003`; `AC-001`, `AC-011`, `AC-012`, `AC-015`, `AC-016`.
- Files: modify existing `frontend/src/pages/index.astro` and `frontend/src/layouts/Layout.astro`; create proposed `frontend/src/styles/global.css`, `frontend/src/styles/page.css`, and `frontend/src/assets/portfolio/`; remove starter-only `Welcome.astro`, `astro.svg`, and `background.svg` once no longer referenced.
- Approach:
  - Keep one Astro page and one semantic document flow; do not add routing or a client framework.
  - Map approved typography/color/spacing/radius roles into CSS custom properties or equivalent maintainable CSS variables rather than scattering magic values through sections.
  - Apply the approved dark-text contrast correction at the token/rule level so Accent CTA and affected service labels inherit compliant foregrounds consistently.
  - Establish resilient width/inset/typography primitives that allow vertical growth, 320 CSS px reflow, and 200% zoom without fixed-height clipping.
  - Export required source assets into the portfolio asset directory without modifying Figma. Preserve `AUD-009` by exporting/using standalone Work 05 for logical slot 05.
  - Verify the permitted delivery source for Plus Jakarta Sans before finalizing typography; do not add a package or third-party runtime request solely by assumption.
- Dependencies/order: First implementation slice; `PLAN-002` and `PLAN-003` depend on its shell/style/asset conventions.
- Validation: `pnpm build`; inspect resulting document outline/landmarks; confirm no starter UI/assets remain referenced; verify page shell does not introduce horizontal overflow at 320 CSS px before section detail is added.
- Risks/assumptions: Asset export filenames and font-delivery mechanism are not present in the current repository and must be resolved from source/licensing evidence during implementation, without changing product behavior.

### PLAN-002 — Implement the static content sections with accessibility and responsive behavior integrated

- Objective: Build Header, Hero/services, About, Contact, and Footer as source-faithful Astro sections while implementing native link semantics, image meaning, focus states, contrast fixes, and content-driven responsive transformations at the same time.
- References: `REQ-FR-001`–`003`, `REQ-FR-006`, `REQ-AR-001`–`007`, `REQ-NFR-001`–`002`; `SPEC-BEH-001`–`003`, `SPEC-INT-001`, `SPEC-ACC-001`, `SPEC-ACC-002`, `SPEC-ACC-004`–`006`, `SPEC-VAL-001`, `SPEC-VAL-003`; `AC-001`–`003`, `AC-008`, `AC-010`–`013`, `AC-015`, `AC-016`.
- Files: create proposed `Header.astro`, `Hero.astro`, `About.astro`, `Contact.astro`, `Footer.astro`, and `ConsultationLink.astro`; modify `index.astro`, `page.css`, and portfolio assets.
- Approach:
  - Compose sections in Hero → About → Work placeholder → Contact → Footer order, with the hero title as `h1` and About/Work/Contact as the next section heading level.
  - Render every source-observed consultation action through the shared native-link component with literal `href="#"`; preserve Dark/Accent visual roles and `:focus-visible` treatment without replacing link semantics with buttons.
  - Render all six service categories once. Keep their artwork decorative and use the approved dark primary text role for UI/UX, Apps, and Photography labels.
  - Render the profile portrait as meaningful content with the approved alternative text.
  - Implement narrow/middle/wide visual relationships from the source but choose actual CSS transition points from layout failure conditions, not device-name defaults. Allow copy blocks/sections to grow vertically under zoom or longer wrapping.
  - Preserve the dark Contact closing hierarchy and a separate Footer role; do not invent footer navigation or destinations.
- Dependencies/order: After `PLAN-001`; can be implemented before carousel enhancement because all content except Work interaction is static.
- Validation: `pnpm build`; keyboard Tab/Shift+Tab and visible-focus check for every consultation link; rendered contrast measurement for corrected pairings; image-alt/decorative-image inspection; responsive/visual comparison at 375px, 768px, 1440px plus intermediate widths and 320 CSS px reflow/200% zoom.
- Risks/assumptions: Breakpoint numbers remain implementation evidence, not design facts; source fidelity must yield to the already approved contrast corrections where exact Figma colors fail WCAG.

### PLAN-003 — Implement Work as a progressively enhanced cyclic carousel

- Objective: Deliver the five-position Work gallery with all content available in initial HTML and a dependency-free manual carousel enhancement matching the approved cyclic behavior, accessibility model, visual neighboring cues, and reduced-motion outcome.
- References: `REQ-FR-004`, `REQ-FR-005`, `REQ-FR-006`, `REQ-AR-002`–`007`, `REQ-NFR-001`, `REQ-NFR-002`; `SPEC-BEH-003`, `SPEC-BEH-004`, `SPEC-INT-002`–`005`, `SPEC-ACC-002`–`004`, `SPEC-ACC-006`, `SPEC-DATA-001`, `SPEC-VAL-001`–`003`; `AC-004`–`010`, `AC-012`–`015`; `AUD-009`.
- Files: create proposed `Work.astro`, `frontend/src/scripts/work-carousel.ts`, and `frontend/src/styles/work-carousel.css`; modify `index.astro` and portfolio assets.
- Approach:
  - Server-render all five logical Work items in order 01→05 with item 03 identified as the initial active item and Work 05 mapped to standalone `Asset/Work/05`.
  - Default/no-JavaScript presentation is a horizontally reachable gallery containing all five originals. Carousel controls stay hidden/inert until enhancement succeeds, so failed initialization never exposes dead controls.
  - Enhancement reveals native Previous/Next buttons, keeps focus on the activated button, updates one logical item per accepted activation, starts at 03, wraps 01↔05, never auto-rotates, and serializes rapid activations so state cannot stop between positions.
  - Use the five semantic originals as the authoritative slides. If cyclic edge animation needs duplicate visual neighbors, create only client-side visual clones, mark them `aria-hidden="true"`/non-focusable, and snap back to the corresponding original after the short transition; clones never become semantic slides or project links.
  - Label the carousel from “My Work”, expose “Previous project”/“Next project” button names, expose slide position context 1-of-5 through 5-of-5, and update a polite live region after manual navigation without moving focus.
  - Match the source's 270×180 active mobile anchor and 540×360 tablet/desktop active anchors plus visible neighboring-content cues. Determine actual CSS transition points from rendered fit/intermediate-width testing rather than assuming 375/768/1440 are media-query values.
  - Default movement may use the specified short 200ms ease-out translation. Under `prefers-reduced-motion: reduce`, update to the same logical position without non-essential interpolation.
- Dependencies/order: After `PLAN-001`; may follow or be developed independently of most `PLAN-002` section markup once shared style/assets are established, but final `index.astro` integration is coordinated.
- Validation: `pnpm build`; no-JavaScript/failure fallback check; keyboard Enter/Space and focus-retention check; pointer/touch button activation check; 03 initial state; one-step movement; both cyclic edges; rapid-input serialization; live-region/slide-label inspection; reduced-motion check; visual comparison at 375px/768px/1440px and intermediate widths; confirm all five actual assets/alt texts including Work 05.
- Risks/assumptions: The cyclic visual-clone technique is implementation-only and must not duplicate assistive content. No carousel package is justified by the current bounded behavior.

### PLAN-004 — Integrate and run the implementation regression/preview gate

- Objective: Verify the completed page as one coherent artifact and correct residual implementation defects before task completion/merge; this phase verifies concerns already built into `PLAN-001`–`003` rather than introducing accessibility or responsiveness for the first time.
- References: all approved current-scope `REQ-*`, `SPEC-*`, `AC-001`–`AC-016`, and owner resolutions `AUD-001`–`AUD-004` plus `AUD-009`.
- Files: modify only affected implementation files from `PLAN-001`–`003` as corrections require; no new architecture or product surface is planned.
- Approach:
  - Recheck semantic reading/order, consultation links, service inventory, meaningful/decorative images, carousel state/feedback, contrast deviations, reduced motion, reflow/zoom, and source fidelity as an integrated page.
  - Compare rendered output against the scoped Figma exemplars at 375px, 768px, and 1440px, then inspect intermediate widths for failure-driven breakpoint correctness.
  - Verify the no-JavaScript Work fallback separately from the enhanced carousel.
  - Run the repository-confirmed production build and verify the branch Vercel preview before merge; production promotion remains outside this stage and requires normal repository policy.
  - Confirm no backend, API, authentication, persistence, additional route, modal, Work-detail navigation, autoplay, or unapproved consultation destination entered the implementation.
- Dependencies/order: Last implementation validation slice after `PLAN-001`–`003` are integrated.
- Validation: successful `pnpm build`; browser/preview checks covering `AC-001`–`AC-016`; rendered contrast checks; keyboard/focus/reduced-motion/no-JS checks; final visual comparison and Vercel preview verification.
- Risks/assumptions: The current repository has no automated test/a11y suite; Stage 7 therefore plans evidence-backed browser/manual validation instead of claiming nonexistent commands. Stage 9 task decomposition may add a narrowly justified test tool only if a task-specific risk warrants the dependency and the plan is updated consistently.

### Ordering and coordination

1. `PLAN-001` establishes shell, assets, style conventions, semantics, and buildable foundation.
2. `PLAN-002` implements the static sections and repeated consultation action behavior.
3. `PLAN-003` implements the isolated Work interaction; it can overlap with late `PLAN-002` work only when `index.astro`, shared styles, and asset ownership do not conflict.
4. `PLAN-004` performs integrated regression and preview verification.

There is no migration, persistence, backend rollout, API contract, or rollback procedure beyond normal Git/PR rollback because Stage 6 established that no architecture-level change is required.'''

          text = replace_between(text, '## 5. Repository Context', '## 6. Implementation Plan', repository_context)
          text = replace_between(text, '## 6. Implementation Plan', '## 7. Architecture Decision', implementation_plan)

          risks = r'''## 9. Risks, Assumptions, and Questions

