name: Stage 10 correction validation

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-correction:
    if: github.head_ref == 'agent/stage-10-implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-10-implementation
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Confirm correction scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only edd76540e89eb4e82c82ab567c183eb1b9abf0f4 HEAD -- frontend/)"
          printf '%s\n' "$changed"
          test "$changed" = 'frontend/src/components/Work.astro'

      - name: Install and build
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Install temporary browser validation tooling
        run: |
          pnpm --dir frontend add --save-dev @playwright/test@latest @axe-core/playwright@latest --lockfile=false
          pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Start production preview
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir frontend preview --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4321/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/astro-preview.log
          exit 1

      - name: Run accessibility, carousel, and responsive regressions
        shell: bash
        run: |
          mkdir -p frontend/tests frontend/test-artifacts
          cat > frontend/tests/stage-10-correction.spec.ts <<'TEST'
          import { test, expect } from '@playwright/test';
          import AxeBuilder from '@axe-core/playwright';

          const url = 'http://127.0.0.1:4321/';
          const exemplarHeights = new Map([[375, 3318], [768, 2966], [1440, 2642]]);

          for (const width of [375, 768, 1440]) {
            test(`accessible semantics and exemplar geometry at ${width}px`, async ({ page }) => {
              await page.setViewportSize({ width, height: 900 });
              await page.goto(url);
              await page.evaluate(() => document.fonts.ready);

              const results = await new AxeBuilder({ page }).analyze();
              const blocking = results.violations.filter((violation) =>
                violation.impact === 'critical' || violation.impact === 'serious'
              );
              expect(blocking, JSON.stringify(blocking, null, 2)).toEqual([]);

              const track = page.locator('#work-carousel-track');
              await expect(track).toHaveAttribute('role', 'list');
              await expect(track.locator(':scope > li')).toHaveCount(5);
              await expect(page.getByRole('listitem')).toHaveCount(5);
              await expect(page.getByRole('group', { name: /of 5/ })).toHaveCount(5);
              for (let index = 1; index <= 5; index += 1) {
                await expect(page.getByRole('group', { name: `${index} of 5` })).toHaveCount(1);
              }

              await expect(page.getByRole('heading', { level: 1, name: 'Design solutions made easy' })).toHaveCount(1);
              await expect(page.getByRole('heading', { level: 2 })).toHaveCount(3);
              await expect(page.getByRole('button', { name: 'Previous project' })).toBeVisible();
              await expect(page.getByRole('button', { name: 'Next project' })).toBeVisible();
              await expect(page.locator('[data-carousel-status]')).toHaveAttribute('aria-live', 'polite');
              await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '2');

              const geometry = await page.evaluate(() => ({
                bodyScrollWidth: document.body.scrollWidth,
                bodyClientWidth: document.body.clientWidth,
                rootScrollWidth: document.documentElement.scrollWidth,
                rootClientWidth: document.documentElement.clientWidth,
                height: document.documentElement.scrollHeight,
              }));
              expect(geometry.bodyScrollWidth).toBeLessThanOrEqual(geometry.bodyClientWidth);
              expect(geometry.rootScrollWidth).toBeLessThanOrEqual(geometry.rootClientWidth);
              expect(geometry.height).toBe(exemplarHeights.get(width));

              await page.screenshot({ path: `test-artifacts/correction-${width}.png`, fullPage: true });
            });
          }

          for (const width of [320, 640, 1024]) {
            test(`no page overflow at ${width}px`, async ({ page }) => {
              await page.setViewportSize({ width, height: 900 });
              await page.goto(url);
              const geometry = await page.evaluate(() => ({
                bodyScrollWidth: document.body.scrollWidth,
                bodyClientWidth: document.body.clientWidth,
                rootScrollWidth: document.documentElement.scrollWidth,
                rootClientWidth: document.documentElement.clientWidth,
              }));
              expect(geometry.bodyScrollWidth).toBeLessThanOrEqual(geometry.bodyClientWidth);
              expect(geometry.rootScrollWidth).toBeLessThanOrEqual(geometry.rootClientWidth);
            });
          }

          test('keyboard activation, focus retention, and polite announcement', async ({ page }) => {
            await page.setViewportSize({ width: 375, height: 900 });
            await page.goto(url);

            const next = page.getByRole('button', { name: 'Next project' });
            const previous = page.getByRole('button', { name: 'Previous project' });

            await next.focus();
            await page.keyboard.press('Enter');
            await page.waitForTimeout(230);
            await expect(next).toBeFocused();
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '3');
            await expect(page.locator('[data-carousel-status]')).toHaveText('Project 4 of 5');

            await previous.focus();
            await page.keyboard.press('Space');
            await page.waitForTimeout(230);
            await expect(previous).toBeFocused();
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '2');
            await expect(page.locator('[data-carousel-status]')).toHaveText('Project 3 of 5');
          });

          test('cyclic edges and rapid input remain serialized', async ({ page }) => {
            await page.setViewportSize({ width: 768, height: 900 });
            await page.goto(url);
            const previous = page.getByRole('button', { name: 'Previous project' });
            const next = page.getByRole('button', { name: 'Next project' });

            await previous.click();
            await previous.click();
            await previous.click();
            await page.waitForTimeout(680);
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '4');
            await expect(page.locator('[data-carousel-status]')).toHaveText('Project 5 of 5');

            await next.click();
            await page.waitForTimeout(230);
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '0');
            await expect(page.locator('[data-carousel-status]')).toHaveText('Project 1 of 5');

            await next.click();
            await next.click();
            await next.click();
            await page.waitForTimeout(680);
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '3');
            await expect(page.locator('[data-carousel-status]')).toHaveText('Project 4 of 5');
          });

          test('reduced motion preserves carousel outcome', async ({ page }) => {
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.setViewportSize({ width: 375, height: 900 });
            await page.goto(url);
            await page.getByRole('button', { name: 'Next project' }).click();
            await page.waitForTimeout(20);
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '3');
            await expect(page.locator('[data-carousel-status]')).toHaveText('Project 4 of 5');
          });

          test('touch activation preserves one-step behavior', async ({ browser }) => {
            const context = await browser.newContext({ viewport: { width: 375, height: 900 }, hasTouch: true, isMobile: true });
            const page = await context.newPage();
            await page.goto(url);
            await page.getByRole('button', { name: 'Next project' }).tap();
            await page.waitForTimeout(230);
            await expect(page.locator('[data-carousel-slide][aria-current="true"]')).toHaveAttribute('data-index', '3');
            await context.close();
          });

          test('no-JavaScript fallback keeps all projects reachable and controls inert', async ({ browser }) => {
            const context = await browser.newContext({ viewport: { width: 375, height: 900 }, javaScriptEnabled: false });
            const page = await context.newPage();
            await page.goto(url);
            await expect(page.getByRole('listitem')).toHaveCount(5);
            await expect(page.getByRole('group', { name: /of 5/ })).toHaveCount(5);
            await expect(page.locator('[data-carousel-controls]')).toBeHidden();
            const scroll = await page.locator('#work-carousel-track').evaluate((element) => {
              const track = element as HTMLElement;
              const before = track.scrollLeft;
              track.scrollLeft = track.scrollWidth;
              return { before, after: track.scrollLeft, scrollWidth: track.scrollWidth, clientWidth: track.clientWidth };
            });
            expect(scroll.scrollWidth).toBeGreaterThan(scroll.clientWidth);
            expect(scroll.after).toBeGreaterThan(scroll.before);
            await context.close();
          });
          TEST
          pnpm --dir frontend exec playwright test tests/stage-10-correction.spec.ts --reporter=line

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-10-correction-screenshots
          path: frontend/test-artifacts/*.png
          if-no-files-found: ignore

      - name: Self-clean validation runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/stage-10-correction-validation.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -u .github/workflows/stage-10-correction-validation.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Remove correction validation runner'
            git push origin HEAD:agent/stage-10-implementation
          fi
