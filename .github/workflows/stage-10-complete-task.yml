name: Stage 10 complete task

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  complete-task:
    if: github.head_ref == 'agent/stage-10-implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-10-implementation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify deployed frontend matches current branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 942dc181d9111cda59bff6ca45ca9ea2efdc3060 HEAD -- frontend/
          echo 'Frontend is unchanged from the READY Vercel preview commit.'

      - name: Prepare local lineage alias for GitHub-pinned repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'https:/github.com/ferfalcon'
          ln -s ../../.. 'https:/github.com/ferfalcon/single-page-design-portfolio'
          git -C 'https://github.com/ferfalcon/single-page-design-portfolio' rev-parse --is-inside-work-tree
          git -C 'https://github.com/ferfalcon/single-page-design-portfolio' cat-file -e '07635a8eafb4323909619a0b62e41a4d8144d764^{commit}'

      - name: Pass Vercel validation and complete P01-T01
        shell: bash
        run: |
          set -euo pipefail
          EXECUTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          CLI='node docs/implementation-workflow/cli/design-workflow.mjs'

          $CLI sync
          $CLI task unblock P01-T01

          $CLI task validation set P01-T01 \
            --name 'Vercel preview' \
            --kind Manual \
            --required true \
            --status Passed \
            --expected 'The implementation branch Vercel preview renders the approved page without material regression before merge.' \
            --actual 'Git-connected preview deployment dpl_5C55vhnqxTdKWoZRyfmuGJ3CEVEn is READY and returns HTTP 200 with the complete approved single-page markup; its deployed frontend is byte-identical to the current branch frontend.' \
            --executed-at "$EXECUTED_AT" \
            --evidence 'Vercel deployment dpl_5C55vhnqxTdKWoZRyfmuGJ3CEVEn for PR #16 commit 942dc181d9111cda59bff6ca45ca9ea2efdc3060 is READY at single-page-design-portfolio-ma34jkdb1-fer-falcons-team.vercel.app; the Vercel connector fetched it with HTTP 200 and complete page markup, and git diff from deployed commit to task-completion HEAD is empty for frontend/.' \
            --references 'PLAN-004'

          $CLI sync
          $CLI task complete P01-T01 --commit "$HEAD_COMMIT"
          $CLI sync
          $CLI sync --check
          $CLI validate
          $CLI context --json

      - name: Persist canonical completion state and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf 'https:'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/stage-10-complete-task.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add .workflow
          git add -u .github/workflows/stage-10-complete-task.yml 2>/dev/null || true
          git commit -m 'Complete Stage 10 implementation task'
          git push origin HEAD:agent/stage-10-implementation
