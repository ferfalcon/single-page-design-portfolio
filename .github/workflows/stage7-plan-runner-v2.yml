name: Stage 7 plan runner v2

on:
  push:
    branches:
      - workflow/stage-7-plan
    paths:
      - .workflow/stage7-runner-v2-kick.tmp

permissions:
  contents: write

jobs:
  stage7:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-7-plan
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Advance, plan, review, and preflight Stage 7
        shell: bash
        run: |
          set -euo pipefail
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"
          $CLI sync
          $CLI sync --check
          $CLI validate
          $CLI context --json
          $CLI stage advance
          $CLI artifact reopen ART-IMPLEMENTATION-BRIEF --evidence "Stage 7 adds repository context and the repository-aware implementation plan to the Lite implementation brief."
          python3 .workflow/stage7-plan-patch.py
          $CLI artifact review ART-IMPLEMENTATION-BRIEF --evidence "Stage 7 repository context and PLAN-001 through PLAN-004 completed with two review passes."
          $CLI sync --check
          $CLI validate
          $CLI stage check --json | tee /tmp/stage7-check.json
          $CLI context --json | tee /tmp/stage7-context.json
          git diff --check
          echo '=== STAGE 7 CHECK ==='
          cat /tmp/stage7-check.json
          echo '=== STAGE 7 CONTEXT ==='
          cat /tmp/stage7-context.json

      - name: Commit clean Stage 7 state
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/stage7-plan-runner-v2.yml \
            .github/workflows/stage7-plan-runner.yml \
            .github/stage7-plan-trigger.txt \
            .github/workflows/stage7-debug3.yml \
            .workflow/stage7-debug3-kick.tmp \
            .workflow/stage7-debug3.log \
            .workflow/stage7-plan-patch.py \
            .workflow/stage7-runner-v2-kick.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Plan Stage 7 implementation"
          git push origin HEAD:workflow/stage-7-plan
