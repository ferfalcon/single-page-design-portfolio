name: Record Stage 5 approval

on:
  push:
    branches:
      - workflow/stage-5-document-review

permissions:
  contents: write

jobs:
  approve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Review and record Stage 5 approval
        shell: bash
        run: |
          set -euo pipefail
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"

          $CLI artifact review ART-IMPLEMENTATION-BRIEF \
            --evidence "Stage 5 documentation consistency review completed after the AUD-009 owner resolution."

          $CLI stage check --json

          $CLI stage review \
            --result "Passed" \
            --evidence "Project owner approved Stage 5 on 2026-08-18 after resolving AUD-009 to use standalone Asset/Work/05 for logical Work position 05. The documentation review completed both required passes, the consolidated brief is Reviewed, and Stage 5 preflight recommends Passed." \
            --approved-by "Fernando Falcon"

          $CLI sync --check
          $CLI validate
          $CLI status --json
          git diff --check

      - name: Commit CLI-produced state and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/advance-stage-5.yml .workflow/stage5-approval-kick.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .workflow .github/workflows/advance-stage-5.yml
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Record Stage 5 approval"
          git push origin HEAD:workflow/stage-5-document-review
