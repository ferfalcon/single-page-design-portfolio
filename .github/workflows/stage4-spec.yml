name: Stage 4 specification runner

on:
  push:
    branches:
      - workflow/stage-4-specification
    paths:
      - .github/workflows/stage4-spec.yml

permissions:
  contents: write

jobs:
  stage4-specification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Stage 4 specification
        run: python .workflow-tmp/stage4_spec_patch.py

      - name: Read canonical workflow context
        run: node docs/implementation-workflow/cli/design-workflow.mjs context --json

      - name: Run Stage 4 preflight
        run: node docs/implementation-workflow/cli/design-workflow.mjs stage check --json

      - name: Check generated workflow projections
        run: node docs/implementation-workflow/cli/design-workflow.mjs sync --check

      - name: Commit specification and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IMPLEMENTATION-BRIEF.md
          git commit -m "Document Stage 4 specification"
          rm -f .workflow-tmp/stage4_spec_patch.py .github/workflows/stage4-spec.yml
          rmdir .workflow-tmp 2>/dev/null || true
          git add -A
          git commit -m "Remove Stage 4 runner"
          git push
