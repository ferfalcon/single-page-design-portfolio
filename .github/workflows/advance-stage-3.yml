name: Advance Stage 3 workflow

on:
  push:
    branches:
      - workflow/stage-3-approval

permissions:
  contents: write

jobs:
  advance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record Stage 3 approval and advance
        shell: bash
        run: |
          set -euo pipefail
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"

          $CLI snapshot verify SRC-DS-001 \
            --result "Unchanged" \
            --method "Fresh Figma metadata inspection of Workflow page 2141:862" \
            --evidence "The scoped Workflow page, mobile/tablet/desktop Home frames, responsive section and navigation components, interaction states, profile portrait, and five Work assets remained present before Stage 3 approval."

          $CLI snapshot verify SRC-REPO-001 \
            --result "Expected workflow output" \
            --method "Git baseline and workflow-output inspection" \
            --evidence "The immutable implementation baseline remains unchanged; approved workflow changes through Stage 3 are documentation and workflow state only, with no frontend implementation changes."

          $CLI stage review \
            --result "Passed" \
            --evidence "Project owner approved the Stage 3 Design Intent on 2026-08-18. The checkpoint has completed both required review passes, preserves the approved AUD-001 through AUD-004 resolutions, and has no blocking design-intent decision." \
            --approved-by "Fernando Falcon"

          $CLI stage advance
          $CLI sync --check
          $CLI validate
          $CLI status --json
          git diff --check

      - name: Commit CLI-produced state and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/advance-stage-3.yml .workflow/stage3-approval-kick.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .workflow IMPLEMENTATION-BRIEF.md .github/workflows/advance-stage-3.yml
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Record Stage 3 approval and advance workflow"
          git push origin HEAD:workflow/stage-3-approval
