name: Record Stage 7 approval

on:
  push:
    branches:
      - workflow/stage-7-plan
    paths:
      - .workflow/stage7-approval-kick.tmp

permissions:
  contents: write

jobs:
  approve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: workflow/stage-7-plan
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record Stage 7 approval
        shell: bash
        run: |
          set -euo pipefail
          CLI="node docs/implementation-workflow/cli/design-workflow.mjs"

          $CLI sync --check
          $CLI validate
          $CLI stage check --json

          $CLI stage review \
            --result "Passed" \
            --evidence "Project owner explicitly approved Stage 7 on 2026-08-18 after PLAN-001 through PLAN-004, both required Stage 7 review passes, repository inspection, traceability, risks, ordering, and validation planning were completed; Stage 7 preflight recommended Passed." \
            --approved-by "Fernando Falcon"

          $CLI sync --check
          $CLI validate
          $CLI status --json
          $CLI context --json
          git diff --check

      - name: Commit CLI-produced state and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/record-stage7-approval.yml .workflow/stage7-approval-kick.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .workflow .github/workflows/record-stage7-approval.yml .workflow/stage7-approval-kick.tmp
          git commit -m "Record Stage 7 approval"
          git push origin HEAD:workflow/stage-7-plan
